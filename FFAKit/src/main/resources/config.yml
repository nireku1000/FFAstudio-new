# FFAKit 設定ファイル
#
# kits: キット選択GUIに表示するアイコン(Materialの名前)
#   - キット名は大文字小文字を区別しません。
#   - ここに無いキットを /ffakit setbase で新規作成すると、アイコンは CHEST になります。
#   - キットを /ffakit delete で削除すると、ここの設定も削除されます。
kits:
  Knight:
    icon: DIAMOND_SWORD
  Archer:
    icon: BOW
  Mage:
    icon: BLAZE_ROD

# OPレベル4の判定に、サーバー直下の ops.json の "level" を使うか。
# true  : ops.json の level が 4 以上のプレイヤーだけを許可(仕様どおり)
# false : OPであれば許可(ops.json を読めない環境用の逃げ道)
ops-json-check: true
