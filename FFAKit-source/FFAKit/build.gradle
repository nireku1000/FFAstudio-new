// FFAKit ビルド設定 (Gradle / Paper 26.2 / Java 25)
plugins {
    id 'java'
}

group = 'dev.ffakit'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Paper 26.2 の最新ビルドを取得 (特定ビルド固定なら 26.2.build.124-stable のように書く)
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName = 'FFAKit.jar'
}
